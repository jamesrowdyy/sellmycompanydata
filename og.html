<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#ffffff;color:#0d0d0d;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:64px 72px;position:relative;
  }
  .grid{
    position:absolute;inset:0;
    background-image:linear-gradient(#ececf1 1px,transparent 1px),linear-gradient(90deg,#ececf1 1px,transparent 1px);
    background-size:60px 60px;
    -webkit-mask-image:radial-gradient(ellipse 80% 70% at 75% 40%,#000 0%,transparent 72%);
    mask-image:radial-gradient(ellipse 80% 70% at 75% 40%,#000 0%,transparent 72%);
  }
  .top,.bottom{position:relative;z-index:2}
  .brand{display:flex;align-items:center;gap:13px;font-size:25px;font-weight:600;letter-spacing:-.02em}
  .mark{width:40px;height:40px;border-radius:11px;background:#0d0d0d;display:flex;align-items:center;justify-content:center}
  .mark svg{width:23px;height:23px}
  h1{font-size:72px;line-height:1.03;letter-spacing:-.036em;font-weight:600;max-width:960px;margin-bottom:22px}
  h1 em{font-style:normal;color:#6e6e80}
  .sub{font-size:26px;color:#6e6e80;letter-spacing:-.01em;max-width:840px;line-height:1.35}
  .bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
  .badge{
    display:inline-flex;align-items:center;gap:12px;border:1px solid #e5e5e5;background:#f7f7f8;
    border-radius:999px;padding:13px 24px;font-size:21px;font-weight:500;color:#353740;
  }
  .dot{width:10px;height:10px;border-radius:50%;background:#10a37f}
  .url{font-size:21px;color:#8e8ea0;font-weight:500}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="top">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg"><path d="M6.6 14.6c.9.9 2.3 1.5 4 1.5 2.6 0 4.2-1.2 4.2-3.1 0-1.7-1-2.5-3.4-3l-1.3-.3c-1.3-.3-1.8-.6-1.8-1.2 0-.7.7-1.1 1.8-1.1 1.1 0 2.1.4 2.9 1.1l1.5-1.7C13.7 5.7 12.3 5.1 10.4 5.1 7.9 5.1 6.3 6.4 6.3 8.3c0 1.7 1.1 2.5 3.4 3l1.3.3c1.3.3 1.8.6 1.8 1.2 0 .7-.8 1.2-2 1.2-1.2 0-2.4-.5-3.2-1.3l-1.4 1.9z" fill="#fff"/></svg></span>
      SellMyCompanyData
    </div>
  </div>
  <div class="top">
    <h1>Your company's data is worth<br><em>more than you think.</em></h1>
    <div class="sub">Get a free valuation of the operating record your business already creates. De-identified before anything moves. Paid in 7 days.</div>
  </div>
  <div class="bottom">
    <div class="badge"><span class="dot"></span>Typically $30K to $3M+</div>
    <div class="url">sellmycompanydata.com</div>
  </div>
</body>
</html>
